publish.workspace = true

[lib]
test = false

[dependencies]
enrang-base = { path = "../enrang-base" }
enrang-rtlib = { path = "../enrang-rtlib" }
enrang-diag = { path = "../enrang-diag" }
enrang-target = { path = "../enrang-target" }
enrang-syntax = { path = "../enrang-syntax" }
enrang-hir = { path = "../enrang-hir" }
enrang-layout = { path = "../enrang-layout" }
enrang-sema = { path = "../enrang-sema" }
enrang-mir = { path = "../enrang-mir" }
enrang-mirbuild = { path = "../enrang-mirbuild" }
