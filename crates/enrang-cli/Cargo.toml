[package]
name = "enrang-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "enrang_cli"
path = "src/lib.rs"

[[bin]]
name = "enrang"
path = "src/main.rs"
test = false

[dependencies]
enrang-diag = { path = "../enrang-diag" }
enrang-target = { path = "../enrang-target" }
enrang-driver = { path = "../enrang-driver" }

[dev-dependencies]
enrang-testkit = { path = "../enrang-testkit" }

[[test]]
name = "cli"
path = "tests/cli/main.rs"
harness = false
